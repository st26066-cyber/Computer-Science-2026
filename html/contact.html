<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="../css/contact.css">
</head>
<body>

    <header>

  <div class="logo">
    <img src="../images/Logo-food-website.gif.png" alt="The Rice Bowl House Logo" width="300">
  </div>

  <!-- Hamburger Button -->
      <div class="hamburger" onclick="toggleMenu()">☰</div>

      <!-- Navigation menu -->
      <div class="nav-section" id="navMenu"> 
        <ul>
          <li><a href="index.html">About us</a></li>
          <li><a href="Menu.html">Menu</a></li>
          <li><a href="restaurant.html">restaurant</a></li>
          <li><a href="contact.html">Contact</a></li>

    </header>

      <!-- Main container for layout -->
  <div class="container">

<!-- Contact Section -->
 <div class="contact-container">
  <h1>Get In Touch</h1>
  <p>Have a question or feedback? We'd love to hear from you!</p>

  <from>

    <label for="name">Name:</label>
    <input type="text" id="name" name="name" required>

    <label for="email">Email:</label>
    <input type="email" id="email" name="email" required>

    <label for="message">Message:</label>
    <textarea id="message" name="message" rows="5" required></textarea>

    <button type="submit">Send Message</button>

  </from>

  <div class="contact-details">
    <h2>Our Details</h2>
    <p><strong>📧 Email:</strong> st26066@ormiston.school.nz</p>
    <p><strong>📞 Phone:</strong> (123) 456-7890</p>
    <p><strong>📍 Location:</strong> Ormiston Senior College, Auckland 2016</p>
  </div>
 </div>

 
<!-- JavaScript at the bottom -->
  <script>
    function toggleMenu() {
      const nav = document.getElementById("navMenu");
      if (nav) {
        nav.classList.toggle("show");
      }
    }
  </script>
  
</body>
</html>
